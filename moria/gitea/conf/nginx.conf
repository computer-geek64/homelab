server {
    listen 127.0.0.1:443 ssl;
    listen 192.168.2.5:443 ssl;
    server_name "gitea.homelab.net";

    ssl_certificate "/certs/homelab.net/homelab.net.crt";
    ssl_certificate_key "/certs/homelab.net/homelab.net.key";

    location / {
        proxy_pass "http://localhost:10003/";
        proxy_set_header Host $host;
    }
}

map $uri $gitea_repository {
    default "";
    ~*^/ashish/(?<repo>[\w\-]+)(?:\.git)?(?:/|$) $repo;
}

map $gitea_repository $gitea_allowed_repository {
    default                     0;
    -                           1;  # fake repo for packages, projects, etc.
    frigate                     1;
    broadcast                   1;
    archer-a9-router-rebooter   1;
    i3-last-scratchpad          1;
    go-addons                   1;
}

server {
    listen 192.210.213.169:443 ssl;
    server_name "gitea.ashishdsouza.com";

    ssl_certificate "/certs/ashishdsouza.com/ashishdsouza.com.crt";
    ssl_certificate_key "/certs/ashishdsouza.com/ashishdsouza.com.key";

    recursive_error_pages on;
    error_page 404 = @error_404;

    location = / {
        limit_except GET {
            deny all;
        }

        return 301 /ashish;
    }

    location ~* ^/(?:assets|avatars|repo-avatars)/ {
        limit_except GET {
            deny all;
        }

        proxy_pass "http://localhost:10003";
    }

    location ~* ^/ashish/?$ {
        limit_except GET {
            deny all;
        }

        root /srv/http/gitea/ashish;
        try_files /index.html =404;
    }

    location ~* ^/ashish/[\w\-]+(?:\.git)?/git-upload-pack$ {
        limit_except GET POST {
            deny all;
        }

        error_page 418 = @repository;
        return 418;
    }

    location ~* ^/ashish/.+ {
        limit_except GET {
            deny all;
        }

        error_page 418 = @repository;
        return 418;
    }

    location @repository {
        if ($gitea_allowed_repository) {
            proxy_pass "http://localhost:10003";
            break;
        }

        return 404;
    }

    location @error_404 {
        rewrite ^ /assets/ break;
        proxy_pass "http://localhost:10003";
    }
}
