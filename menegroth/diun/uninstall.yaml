- name: Stop Diun
  ansible.builtin.import_playbook: stop.yaml

- name: Uninstall Diun
  hosts: Menegroth
  tasks:
  - name: Remove Diun config file
    become: true
    become_user: ashish
    ansible.builtin.file:
      path: /System/Volumes/Data/data/diun.yaml
      state: absent

  - name: Remove Diun data Docker volume
    become: true
    become_user: ashish
    community.docker.docker_volume:
      volume_name: diun-data
      state: absent
  - name: Remove Diun data Docker volume directory
    become: true
    become_user: ashish
    ansible.builtin.file:
      path: /System/Volumes/Data/data/diun-data
      state: absent
