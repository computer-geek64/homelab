- name: Install Nginx
  hosts: Menegroth
  tasks:
    - name: Create Nginx config Docker volume directory
      become: true
      become_user: ashish
      ansible.builtin.file:
        path: /System/Volumes/Data/data/nginx-config
        state: directory
    - name: Create Nginx config Docker volume
      become: true
      become_user: ashish
      community.docker.docker_volume:
        volume_name: nginx-config
        driver: local
        driver_options:
          type: none
          o: bind
          device: /System/Volumes/Data/data/nginx-config
        state: present
    - name: Create Nginx static Docker volume directory
      become: true
      become_user: ashish
      ansible.builtin.file:
        path: /System/Volumes/Data/data/nginx-static
        state: directory
    - name: Create Nginx static Docker volume
      become: true
      become_user: ashish
      community.docker.docker_volume:
        volume_name: nginx-static
        driver: local
        driver_options:
          type: none
          o: bind
          device: /System/Volumes/Data/data/nginx-static
        state: present

    - name: Copy Nginx config file
      become: true
      become_user: ashish
      ansible.builtin.copy:
        src: src/nginx.conf
        dest: /System/Volumes/Data/data/nginx.conf
        mode: preserve
    - name: Copy Nginx config directory
      become: true
      become_user: ashish
      ansible.builtin.copy:
        src: src/conf.d/
        dest: /System/Volumes/Data/data/nginx-config
        mode: preserve

    - name: Read homelab config
      ansible.builtin.slurp:
        src: '{{ansible_facts["user_dir"]}}/.homelab.json'
      register: homelab_config_file
    - name: Set homelab_config variable
      ansible.builtin.set_fact:
        homelab_config: "{{homelab_config_file.content|b64decode|from_json}}"

    - name: Insert into Postgres table service
      community.postgresql.postgresql_query:
        login_host: '{{homelab_config.database.host}}'
        login_user: '{{homelab_config.database.user}}'
        login_password: '{{homelab_config.database.password}}'
        login_db: '{{homelab_config.database.name}}'
        query: 'INSERT INTO service (name, host, source, config) VALUES (%s, %s, %s, %s) ON CONFLICT DO NOTHING;'
        positional_args:
          - '{{item.name}}'
          - '{{item.host}}'
          - '{{item.source}}'
          - '{{item.config}}'
      with_items:
        - {name: nginx_menegroth, host: '{{ansible_facts["hostname"]}}', source: github/computer-geek64/homelab/master/menegroth/nginx, config: null}
    - name: Insert into Postgres table service_data
      community.postgresql.postgresql_query:
        login_host: '{{homelab_config.database.host}}'
        login_user: '{{homelab_config.database.user}}'
        login_password: '{{homelab_config.database.password}}'
        login_db: '{{homelab_config.database.name}}'
        query: 'INSERT INTO service_data (service, data_name, storage_type, source) VALUES (%s, %s, %s, %s) ON CONFLICT DO NOTHING;'
        positional_args:
          - '{{item.service}}'
          - '{{item.data_name}}'
          - '{{item.storage_type}}'
          - '{{item.source}}'
      with_items:
        - {service: nginx_menegroth, data_name: config, storage_type: docker, source: nginx-config}
        - {service: nginx_menegroth, data_name: static, storage_type: docker, source: nginx-static}
